version: '3.8'

services: 
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_pdf_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: ai_pdf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_pdf_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: .
    container_name: ai_pdf_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:securepassword123@db:5432/ai_pdf_db
    depends_on:
      - db
    restart: on-failure

volumes:
  postgres_data: 